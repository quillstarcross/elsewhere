name: Publish ELSEWHERE and verify with Playwright

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Node.js for browser automation
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open the published website in a real browser
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const url = process.env.PAGE_URL;
          if (!url) throw new Error('GitHub Pages did not return a published URL.');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || !response.ok()) throw new Error('Website did not return a successful HTTP response.');
            await page.waitForTimeout(2500);
            const title = await page.title();
            const bodyText = await page.locator('body').innerText();
            if (!bodyText.trim()) throw new Error('Published page is blank.');
            console.log('Published URL:', url);
            console.log('Page title:', title);
            console.log('Browser check passed: page loaded and visible content exists.');
            if (errors.length) console.log('Browser console errors:', errors.join(' | '));
          } finally {
            await browser.close();
          }
          NODE
