name: ELSEWHERE - Playwright Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional deployed ELSEWHERE URL to test. Leave blank to test the repository version."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local ELSEWHERE server
        if: ${{ inputs.target_url == '' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/elsewhere-server.log 2>&1 &
          echo $! > /tmp/elsewhere-server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              echo "Local ELSEWHERE server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/elsewhere-server.log
          exit 1

      - name: Test ELSEWHERE with Chromium
        env:
          TARGET_URL_INPUT: ${{ inputs.target_url }}
        run: |
          if [ -n "$TARGET_URL_INPUT" ]; then
            echo "TARGET_URL=$TARGET_URL_INPUT" >> "$GITHUB_ENV"
          else
            echo "TARGET_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
          fi
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const target = process.env.TARGET_URL_INPUT || 'http://127.0.0.1:4173/';
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const checks = [];
          const check = (name, ok, detail = '') => {
            checks.push({ name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'}: ${name}${detail ? ' — ' + detail : ''}`);
            if (!ok) failures.push(name);
          };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#createBtn', { timeout: 15000 });
            await page.waitForTimeout(2500);

            check('Page responds successfully', await page.title().then(t => t.includes('ELSEWHERE')), await page.title());
            check('World canvas exists', await page.locator('#worldCanvas').count() === 1);
            check('World creation controls exist', await page.locator('#worldPrompt').count() === 1 && await page.locator('#createBtn').isVisible());
            check('Initial structures are displayed', await page.locator('#structureList .structure').count() >= 1);

            await page.locator('#worldPrompt').fill('A lunar research colony with solar energy and a university');
            await page.locator('#createBtn').click();
            await page.waitForTimeout(500);
            check('Prompt creates a lunar world', (await page.locator('#worldLabel').innerText()).includes('Luna Frontier'));
            check('Prompt adds relevant research infrastructure', await page.locator('#structureList').innerText().then(t => /Research Lab/i.test(t)));

            await page.locator('#commandInput').fill('Build a research lab');
            await page.locator('#runCommand').click();
            check('Build command adds a structure', await page.locator('#structureList .structure').count() >= 6);

            await page.locator('#energyRange').fill('90');
            await page.locator('#energyRange').dispatchEvent('change');
            check('Energy control updates state', (await page.locator('#energyValue').innerText()).trim() === '90%');

            await page.locator('#saveBtn').click();
            check('Local save action responds', (await page.locator('#saveStatus').innerText()).includes('Saved in this browser'));

            await page.screenshot({ path: 'elsewhere-playwright.png', fullPage: true }).catch(() => {});
            check('No uncaught page errors', pageErrors.length === 0, pageErrors.join('; '));

            console.log('\nTest summary: ' + checks.filter(c => c.ok).length + '/' + checks.length + ' checks passed.');
            if (failures.length) process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: elsewhere-playwright-screenshot
          path: elsewhere-playwright.png
          if-no-files-found: ignore
          retention-days: 7
