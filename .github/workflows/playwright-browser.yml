name: Playwright Browser Automation

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Website URL for Playwright to open and inspect"
        required: true
        type: string
        default: "https://vercel.com/new"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser automation
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const target = process.env.TARGET_URL;
          const parsed = new URL(target);
          if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('Only HTTP and HTTPS URLs are allowed.');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2000);
            console.log('Requested URL:', target);
            console.log('Final URL:', page.url());
            console.log('HTTP status:', response?.status() ?? 'no response');
            console.log('Page title:', await page.title());
            console.log('Visible text preview:', (await page.locator('body').innerText().catch(() => '')).slice(0, 2000));
            console.log('Browser errors:', errors.length ? errors.join('\n') : 'None detected');
            await page.screenshot({ path: 'playwright-page.png', fullPage: true }).catch(e => console.log('Screenshot note:', e.message));
            if (!response || response.status() >= 400) throw new Error('Browser received an unsuccessful HTTP response.');
          } finally {
            await browser.close();
          }
          NODE

      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-browser-screenshot
          path: playwright-page.png
          if-no-files-found: ignore
          retention-days: 7
