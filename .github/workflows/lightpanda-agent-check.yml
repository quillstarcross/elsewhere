name: Lightpanda Agent Check

on:
  push:
    branches:
      - main
      - feature/lightpanda-hybrid-agent
      - feature/ai-agent-orchestrator
      - feature/agent-web-search
    paths:
      - "browser-agent/**"
      - "render.yaml"
      - ".github/workflows/lightpanda-agent-check.yml"
  pull_request:
    paths:
      - "browser-agent/**"
      - "render.yaml"
      - ".github/workflows/lightpanda-agent-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Lightpanda binary
        run: |
          npm install
          mkdir -p bin
          curl -fsSL --retry 3 https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux -o bin/lightpanda
          chmod +x bin/lightpanda
          ./bin/lightpanda version
      - name: Check server syntax
        run: npm run check
      - name: Smoke test Lightpanda CDP
        run: |
          ./bin/lightpanda serve --host 127.0.0.1 --port 9222 > /tmp/lightpanda.log 2>&1 &
          LPD_PID=$!
          trap 'kill "$LPD_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from "playwright-core";
          let browser;
          let lastError;
          for (let i = 0; i < 20; i++) {
            try {
              browser = await chromium.connectOverCDP({ endpointURL: "ws://127.0.0.1:9222", timeout: 1000 });
              break;
            } catch (error) {
              lastError = error;
              await new Promise(resolve => setTimeout(resolve, 500));
            }
          }
          if (!browser) throw lastError || new Error("Lightpanda CDP did not start");
          const context = await browser.newContext();
          const page = await context.newPage();
          await page.goto("https://example.com", { waitUntil: "domcontentloaded", timeout: 20000 });
          const title = await page.title();
          if (!title.includes("Example")) throw new Error("Unexpected page title: " + title);
          console.log("Lightpanda CDP smoke test passed:", title);
          await context.close();
          await browser.close();
          NODE
