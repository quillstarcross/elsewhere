name: Lightpanda Agent Check

on:
  push:
    branches:
      - main
      - feature/lightpanda-hybrid-agent
    paths:
      - "browser-agent/**"
      - "render.yaml"
      - ".github/workflows/lightpanda-agent-check.yml"
  pull_request:
    paths:
      - "browser-agent/**"
      - "render.yaml"
      - ".github/workflows/lightpanda-agent-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Lightpanda binary
        run: |
          npm install
          mkdir -p bin
          curl -fsSL --retry 3 https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux -o bin/lightpanda
          chmod +x bin/lightpanda
          ./bin/lightpanda version
      - name: Check server syntax
        run: npm run check
