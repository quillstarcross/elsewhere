services:
  - type: web
    name: elsewhere-lightpanda-agent
    runtime: node
    plan: free
    rootDir: browser-agent
    buildCommand: npm install && npx @lightpanda/browser install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AGENT_ACCESS_KEY
        generateValue: true
