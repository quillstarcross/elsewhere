services:
  - type: web
    name: elsewhere-browser-agent
    runtime: node
    plan: free
    rootDir: browser-agent
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BROWSERLESS_TOKEN
        sync: false
      - key: AGENT_ACCESS_KEY
        generateValue: true
      - key: BROWSERLESS_ENDPOINT
        value: wss://production-sfo.browserless.io/chromium/bql
